spring.application.name=similar-products
server.port=5000

# Handle each incoming request on a virtual thread (cheap to block while waiting on the product APIs)
spring.threads.virtual.enabled=true

# External product APIs (the mocks from dalogax/backendDevTest)
product-api.base-url=http://localhost:3001
product-api.connect-timeout=1s
# Upper bound for a single upstream call; slower responses are treated as failures
product-api.read-timeout=10s

# How long a request waits for a product before skipping it.
# A slower upstream call keeps running in the background and fills the cache.
product-catalog.lookup-timeout=3s
product-catalog.cache.ttl=10m
product-catalog.cache.maximum-size=10000

# Circuit breakers (one for the similar ids service, one per product for details)
product-catalog.circuit-breaker.failure-rate-threshold=50
product-catalog.circuit-breaker.sliding-window-size=10
product-catalog.circuit-breaker.minimum-number-of-calls=5
product-catalog.circuit-breaker.wait-duration-in-open-state=10s
