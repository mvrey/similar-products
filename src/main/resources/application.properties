spring.application.name=similar-products
server.port=5000

# Handle each incoming request on a virtual thread (cheap to block while waiting on the product APIs)
spring.threads.virtual.enabled=true

# Caffeine logs every failed cache load with a full stack trace. Those failures are already reported
# by the request that hit them, so keep only Caffeine's own errors.
logging.level.com.github.benmanes.caffeine=ERROR

# External product APIs (the mocks from dalogax/backendDevTest)
product-api.base-url=http://localhost:3001
product-api.connect-timeout=1s
# Upper bound for a single upstream call; slower responses are treated as failures
product-api.read-timeout=10s

# How long a request waits for a product before skipping it.
# A slower upstream call keeps running in the background and fills the cache.
product-catalog.lookup-timeout=3s
product-catalog.cache.ttl=10m
# Short, so a product that is created upstream shows up quickly
product-catalog.cache.not-found-ttl=1m
# Entries read after this age are reloaded in the background while the cached value is still served
product-catalog.cache.refresh-after=8m
product-catalog.cache.maximum-size=10000

# Circuit breakers (one for the similar ids service, one per product for details)
product-catalog.circuit-breaker.failure-rate-threshold=50
product-catalog.circuit-breaker.sliding-window-size=10
product-catalog.circuit-breaker.minimum-number-of-calls=5
product-catalog.circuit-breaker.wait-duration-in-open-state=10s
product-catalog.circuit-breaker.idle-product-breaker-expiry=30m
product-catalog.circuit-breaker.max-product-breakers=10000

# Cap on simultaneous calls to the external product APIs (cached and coalesced lookups don't count)
product-catalog.bulkhead.max-concurrent-calls=200
product-catalog.bulkhead.max-wait-duration=500ms

# How long clients may reuse a successful response (Cache-Control: max-age)
similar-products.response-max-age=60s

# Expose health and metrics (cache, circuit breakers, bulkhead) through Actuator
management.endpoints.web.exposure.include=health,metrics
